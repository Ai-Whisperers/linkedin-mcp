[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "LinkedIn Marketing/Share REST API MCP server for Hermes (Community Management + Share on LinkedIn + Sign In)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ai-Whisperers" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkedin_mcp"]